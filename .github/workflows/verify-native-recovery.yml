name: Verify recovered native data download
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        required: true
        type: string
permissions:
  contents: write
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      HONEYCOMB_ACTIONS_LOG: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked --extra cloud
      - name: Download manifest from published recovery release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c 'import os; assert os.environ["SOURCE_RUN_ID"].isdigit()'
          gh release download "linux-impact-7j-$SOURCE_RUN_ID" --pattern impact-artifact-manifest.json --dir output
      - name: Verify canonical part URLs, every checksum and retained numerical exports
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --locked python scripts/verify_native_recovery.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: native-recovery-verification-${{ github.run_id }}
          path: |
            output/*.json
            output/actions-logs/**
          retention-days: 30
