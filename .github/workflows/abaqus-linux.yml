name: Licensed Linux research run
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Existing owner-created catalog job ID'
        required: true
        type: string
permissions:
  contents: write
  checks: write
  id-token: write
concurrency:
  group: honeycomb-licensed-solver
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      max_parallel: ${{ steps.matrix.outputs.max_parallel }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked --extra cloud
      - name: Verify qualification before claiming the batch
        env:
          PLATFORM_POLICY_EVIDENCE_URL: ${{ vars.PLATFORM_POLICY_EVIDENCE_URL }}
        run: uv run --locked --extra cloud python -c 'from pathlib import Path; from scripts.cloud_worker import require_qualification; require_qualification(Path.cwd())'
      - name: Claim batch and expand one design per runner
        id: matrix
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUD_JOB_ID: ${{ inputs.job_id }}
        run: uv run --locked --extra cloud python scripts/cloud_matrix.py prepare --job-id "$CLOUD_JOB_ID"
  simulate:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.prepare.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: Design ${{ matrix.index }} — separate 4 CPU runner
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    env:
      CLOUD_JOB_ID: ${{ inputs.job_id }}
      PLATFORM_POLICY_EVIDENCE_URL: ${{ vars.PLATFORM_POLICY_EVIDENCE_URL }}
      ABAQUS_LINUX_BUNDLE_URL: ${{ secrets.ABAQUS_LINUX_BUNDLE_URL }}
      ABAQUS_LINUX_BUNDLE_SHA256: ${{ vars.ABAQUS_LINUX_BUNDLE_SHA256 }}
      ABAQUS_LICENSE_ENDPOINT: ${{ secrets.ABAQUS_LICENSE_ENDPOINT }}
      ABAQUS_VENDOR_PORT: ${{ secrets.ABAQUS_VENDOR_PORT }}
      ABAQUS_DISK_BUDGET_JSON: ${{ vars.ABAQUS_DISK_BUDGET_JSON }}
    steps:
      - name: Start entire-job execution budget
        run: echo "HONEYCOMB_WORKFLOW_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra cloud
      - name: Verify qualified runtime before installing anything
        run: |
          uv run --locked --extra cloud python -c 'from pathlib import Path; from scripts.cloud_worker import require_qualification; require_qualification(Path.cwd())'
      - name: Join private license network
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:honeycomb-runner
      - name: Verify private license network before installing
        run: uv run --locked --extra cloud python scripts/check_license_network.py
      - name: Install checksum-pinned Linux runtime
        run: uv run --locked --extra cloud python scripts/prepare_cloud_runtime.py
      - name: Run real solver and preserve research outputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HONEYCOMB_DRIVE_CREDENTIALS_JSON: ${{ secrets.HONEYCOMB_DRIVE_CREDENTIALS_JSON }}
          CLOUD_CHILD_ID: ${{ matrix.child_id }}
        run: uv run --locked --extra cloud python scripts/cloud_worker.py --parent-id "$CLOUD_JOB_ID" --job-id "$CLOUD_CHILD_ID" --abaqus /opt/SIMULIA/Commands/abaqus --root "$RUNNER_TEMP/honeycomb-results"
      - name: Preserve bounded diagnostics when interrupted
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: interrupted-diagnostics-${{ github.run_id }}-${{ matrix.index }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            output/*.json
            ${{ runner.temp }}/honeycomb-results/**/requested-input.json
            ${{ runner.temp }}/honeycomb-results/**/resolved-input.json
            ${{ runner.temp }}/honeycomb-results/**/logs/*.log
  finalize:
    needs: [prepare, simulate]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked --extra cloud
      - name: Aggregate completed and interrupted runners
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUD_JOB_ID: ${{ inputs.job_id }}
        run: uv run --locked --extra cloud python scripts/cloud_matrix.py finalize --job-id "$CLOUD_JOB_ID"
