name: Actions log acceptance and preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/honeycomb_studio/actions_log.py
      - scripts/actions_step.py
      - scripts/preview_actions_log.py
      - tests/test_actions_log.py
      - tests/test_actions_activity.py
      - .github/workflows/log-preview.yml
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: '01 · Cài môi trường và theo dõi thời gian, tiến trình'
        env:
          HONEYCOMB_ACTIONS_LOG: '1'
        run: python3 scripts/actions_step.py --title "Cài môi trường Python" --details output/actions-logs/environment.log -- uv sync --locked --extra cloud
      - name: '02 · Kiểm tra che thông tin riêng, tiến độ, lỗi và link web'
        run: uv run --locked pytest tests/test_actions_log.py tests/test_actions_vietnamese.py tests/test_actions_activity.py -q
      - name: '03 · Kiểm tra truyền HTTP nội bộ và mẫu hiển thị tiến độ'
        env:
          HONEYCOMB_ACTIONS_LOG: '1'
        run: uv run --locked python scripts/preview_actions_log.py
      - name: '04 · Lưu log chi tiết và dữ liệu sự kiện đã che thông tin riêng'
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: actions-log-preview-${{ github.run_id }}
          path: output/actions-logs/**
          if-no-files-found: error
          retention-days: 14
