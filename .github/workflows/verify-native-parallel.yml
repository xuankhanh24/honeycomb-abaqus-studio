name: Kiểm tra native song song · hai mô hình smoke
on:
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: honeycomb-licensed-solver
  cancel-in-progress: false
env:
  HONEYCOMB_ACTIONS_LOG: '1'
  ABAQUS_MEDIA_DRIVE_FILE_ID: ${{ vars.ABAQUS_MEDIA_DRIVE_FILE_ID }}
  HONEYCOMB_LOG_TITLE: 'Kiểm tra native song song — mô hình smoke ngắn'
jobs:
  install:
    name: Chuẩn bị, mô phỏng và lưu kết quả
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    if: github.ref == 'refs/heads/main'
    steps:
      - name: '01 · Lấy mã nguồn của lượt chạy'
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: '02 · Chuẩn bị công cụ quản lý Python'
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: '03 · Cài môi trường Python và thư viện'
        run: python3 scripts/actions_step.py --title "Cài môi trường Python" --details output/actions-logs/python.log -- uv sync --locked --extra cloud
      - name: '04 · Kiểm tra đầu vào trước khi tải bộ cài'
        run: uv run --locked --extra cloud pytest tests/test_native_smoke_spec.py -q
      - name: '05 · Giữ chỗ Release đúng phiên bản mã nguồn'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --locked --extra cloud python scripts/linux_media/impact_test.py --reserve --parallel-smoke
      - name: '06 · Cài công cụ giải nén và dựng môi trường Linux'
        run: |
          python3 scripts/actions_step.py --title "Cài công cụ giải nén bộ cài" --details output/actions-logs/packages.log -- bash -c 'sudo apt-get update -qq && sudo apt-get install -y unrar p7zip-full'
          python3 scripts/actions_step.py --title "Dựng môi trường Linux tương thích với Abaqus" --details output/actions-logs/image.log -- docker build --build-arg MODEL_UID=$(id -u) -t honeycomb-install-probe scripts/linux_media
      - name: '07 · Tải bộ cài: dung lượng, tốc độ và thời gian còn lại'
        env:
          HONEYCOMB_DRIVE_CREDENTIALS_JSON: ${{ secrets.HONEYCOMB_DRIVE_CREDENTIALS_JSON }}
        run: uv run --locked python scripts/actions_step.py --title "Chuẩn bị ISO: ưu tiên kho Drive riêng" --details output/actions-logs/download.log -- uv run --locked python scripts/prepare_linux_media.py
      - name: '08 · Kiểm tra SHA-256 và cài Abaqus trong môi trường cách ly'
        run: python3 scripts/actions_step.py --title "Kiểm tra mã SHA-256 và cài Abaqus" --details output/actions-logs/install.log -- bash scripts/linux_media/install_runtime.sh
      - name: '09 · Kết nối riêng tới máy chủ cấp phép Abaqus'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:honeycomb-runner
      - name: '10 · Chạy hai mô hình smoke ngắn để kiểm tra môi trường'
        env:
          ABAQUS_LICENSE_ENDPOINT: ${{ secrets.ABAQUS_LICENSE_ENDPOINT }}
          ABAQUS_VENDOR_PORT: ${{ secrets.ABAQUS_VENDOR_PORT }}
        run: uv run --locked --extra cloud python scripts/linux_media/impact_test.py --parallel-smoke
      - name: '11 · Tải kết quả lên GitHub Releases và đối chiếu SHA-256'
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --locked --extra cloud python scripts/linux_media/impact_test.py --publish
      - name: '12 · Lưu bản dự phòng và log để chẩn đoán'
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: linux-parallel-angle-smoke-${{ github.run_id }}
          path: |
            output/actions-logs/**
            output/media-inspection/inspection.json
            output/install-probe/*.json
            output/install-probe/*.log
            output/impact-*.json
            ${{ runner.temp }}/honeycomb-impact/**/*.json
            ${{ runner.temp }}/honeycomb-impact/**/*.log
            ${{ runner.temp }}/honeycomb-impact/**/*.sta
            ${{ runner.temp }}/honeycomb-impact/**/*.inp
            ${{ runner.temp }}/honeycomb-impact/**/*.cae
            ${{ runner.temp }}/honeycomb-impact/**/*.odb
            ${{ runner.temp }}/honeycomb-impact/**/*.csv
            ${{ runner.temp }}/honeycomb-impact/**/*.parquet
            ${{ runner.temp }}/honeycomb-impact/**/*.pdf
            ${{ runner.temp }}/honeycomb-impact/**/*.docx
            ${{ runner.temp }}/honeycomb-impact/**/*.png
            ${{ runner.temp }}/honeycomb-impact/**/*.gif
            ${{ runner.temp }}/honeycomb-impact/**/*.dat
            ${{ runner.temp }}/honeycomb-impact/**/*.msg
            ${{ runner.temp }}/honeycomb-impact/**/*.txt
            ${{ runner.temp }}/honeycomb-impact/**/*.md
            ${{ runner.temp }}/honeycomb-impact/**/*.tar
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
