[project]
name = "honeycomb-studio"
version = "0.1.0"
description = "Reproducible Abaqus honeycomb impact studies, datasets and reports"
readme = "README.md"
authors = [
    { name = "xuankhanh24", email = "273490538+xuankhanh24@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.156.4",
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "psutil>=7.2.2",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "pywin32>=312",
    "reportlab>=5.0.1",
    "scipy>=1.18.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
honeycomb-studio = "honeycomb_studio.cli:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "ty>=0.0.90",
]

[tool.ruff]
target-version = "py313"
line-length = 110
extend-exclude = ["src/honeycomb_studio/adapters"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B023"]

[tool.pytest.ini_options]
testpaths = ["tests"]
