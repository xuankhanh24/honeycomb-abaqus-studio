name: Core damage · one design per job
run-name: core-damage · ${{ inputs.ticket }}
on:
  workflow_dispatch:
    inputs:
      campaign_id:
        required: true
        type: string
      ticket:
        required: true
        type: string
      source_sha:
        required: true
        type: string
permissions:
  contents: write
  checks: write
  id-token: write
concurrency:
  group: core-damage-ticket-${{ inputs.ticket }}
  cancel-in-progress: false
jobs:
  solver:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    env:
      ABAQUS_MEDIA_DRIVE_FILE_ID: ${{ vars.ABAQUS_MEDIA_DRIVE_FILE_ID }}
      ABAQUS_LICENSE_ENDPOINT: ${{ secrets.ABAQUS_LICENSE_ENDPOINT }}
      ABAQUS_VENDOR_PORT: ${{ secrets.ABAQUS_VENDOR_PORT }}
      CAMPAIGN_ID: ${{ inputs.campaign_id }}
      TICKET: ${{ inputs.ticket }}
      GITHUB_TOKEN: ${{ github.token }}
      HONEYCOMB_ACTIONS_LOG: '1'
    steps:
      - run: echo "HONEYCOMB_WORKFLOW_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked --extra cloud --extra campaign
      - name: Atomically claim one execution ticket before preparation
        run: uv run --locked --extra cloud python scripts/campaign_worker.py claim --campaign-id "$CAMPAIGN_ID" --ticket "$TICKET"
      - name: Reclaim hosted runner disk for the unchanged research output
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          df -B1 / /mnt
          # Fixed disposable SDK paths on the ephemeral Linux runner only.
          # Keep Docker, system Python, Node Actions and the checked-out source.
          for directory in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/share/powershell /usr/local/share/chromium /opt/az /usr/lib/jvm /opt/hostedtoolcache/CodeQL; do
            if test -d "$directory" && ! test -L "$directory"; then
              sudo rm -rf --one-file-system -- "$directory"
            fi
          done
          if test -f scripts/reclaim_runner_disk.py; then
            uv run --locked python scripts/reclaim_runner_disk.py
          fi
          sudo apt-get clean
          docker image prune --all --force
          df -B1 / /mnt
      - name: Check design storage before downloading the runtime
        shell: bash
        run: |
          uv run --locked --extra cloud --extra campaign python - <<'PY'
          import json, os, shutil
          from honeycomb_studio.campaign import one_run_spec
          from honeycomb_studio.campaign_queue import ticket_key
          from honeycomb_studio.cloud_github import Catalog, Github
          from honeycomb_studio.estimates import predict
          from honeycomb_studio.models import ModelSpec
          work, _ = Catalog(Github(token=os.environ['GITHUB_TOKEN'])).get(
              ticket_key(os.environ['CAMPAIGN_ID'], os.environ['TICKET']))
          spec = one_run_spec(work['design'])
          model = ModelSpec.model_validate(work['design']['model']).resolved()
          try:
              from honeycomb_studio.execution import disk_requirement
          except ImportError:
              required = predict(model)['recommended_free_gb_above_reserve']
          else:
              required = disk_requirement(spec, model, linked_checkpoint=True)
          required += spec['min_free_gb']
          available = shutil.disk_usage('/tmp').free / 1e9
          print(json.dumps({'design_id': work['design']['id'], 'available_GB': available,
                            'required_GB_above_installed_runtime': required,
                            'physics_changed': False}), flush=True)
          if available < required:
              raise SystemExit('Preparation blocked: insufficient disk even before runtime installation')
          PY
      - name: Load independently pinned installation transport
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ vars.CORE_DAMAGE_TRANSPORT_SOURCE_SHA }}
          path: runtime-tools
          persist-credentials: false
      - uses: ./runtime-tools/.github/actions/abaqus-runtime
        with:
          transport_script: runtime-tools/scripts/prepare_linux_media.py
          tailscale_id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          drive_credentials: ${{ secrets.HONEYCOMB_DRIVE_CREDENTIALS_JSON }}
          media_release_key: ${{ secrets.ABAQUS_MEDIA_RELEASE_KEY }}
      - name: Release verified installation media before resource admission
        shell: bash
        run: |
          set -euo pipefail
          mountpoint="$RUNNER_TEMP/abaqus-mount"
          media="$RUNNER_TEMP/abaqus-media-inspection/iso/DS.SIMULIA.Suite.2020.Linux64_Softgozar.com.iso"
          if mountpoint -q "$mountpoint"; then sudo umount "$mountpoint"; fi
          test -f "$media"
          rm -- "$media"
          df -B1 / /mnt
      - name: Solve or restore the exact predecessor state
        run: uv run --locked --extra cloud python runtime-tools/scripts/campaign_checkpoint_transport.py run --campaign-id "$CAMPAIGN_ID" --ticket "$TICKET"
      - uses: actions/upload-artifact@v7.0.2
        if: failure() || cancelled()
        with:
          name: core-damage-${{ inputs.ticket }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            /tmp/honeycomb-results/**
            !/tmp/honeycomb-results/**/credentials/**
            !/tmp/honeycomb-results/**/session.json
            !/tmp/honeycomb-results/**/engine-settings.json
      - name: Record preparation failure separately from solver failure
        if: failure() || cancelled()
        run: uv run --locked --extra cloud python scripts/campaign_worker.py failure --campaign-id "$CAMPAIGN_ID" --ticket "$TICKET"
