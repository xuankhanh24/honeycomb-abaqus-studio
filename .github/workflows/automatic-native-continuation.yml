name: Automatic V14 timeout handoff
run-name: Automatic continuation for V14 03749dbc
on:
  workflow_run:
    workflows: ['Mô phỏng bài đã chọn từ web']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: automatic-continuation-03749dbc
  cancel-in-progress: false
jobs:
  handoff:
    if: github.event_name == 'workflow_dispatch' || format('{0}', github.event.workflow_run.id) == '43914437764'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked --extra cloud
      - name: Preserve finished cases and continue only authorized timeout cases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --locked --extra cloud python scripts/dispatch_automatic_continuation.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: automatic-continuation-receipt
          path: output/automatic-continuation.json
          if-no-files-found: ignore
          retention-days: 30
