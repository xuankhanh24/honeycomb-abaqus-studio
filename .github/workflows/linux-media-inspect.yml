name: Inspect Linux media without executing it
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install archive readers from Ubuntu repositories
        run: sudo apt-get update -qq && sudo apt-get install -y unrar p7zip-full
      - name: Download, hash and inventory candidate ISO; no license or installer execution
        run: python3 scripts/inspect_linux_media.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: linux-media-inspection-${{ github.run_id }}
          path: output/media-inspection/inspection.json
          retention-days: 30
          if-no-files-found: error
