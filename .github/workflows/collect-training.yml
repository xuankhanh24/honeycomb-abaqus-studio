name: Tổng hợp dữ liệu huấn luyện từ các job
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: honeycomb-training-collection
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked --extra cloud
      - name: Xác minh dữ liệu nguồn · lọc chất lượng · gộp bảng X/y · xuất ZIP, CSV, Parquet
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HONEYCOMB_ACTIONS_LOG: '1'
        run: uv run --locked --extra cloud python scripts/collect_cloud_training.py
