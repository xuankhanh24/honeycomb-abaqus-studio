name: Recover retained matrix ODB
run-name: Restore original artifact ${{ inputs.artifact_id }} | no FE solve
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        required: true
        type: string
      parent_job_id:
        required: true
        type: string
      index:
        required: true
        type: string
      artifact_id:
        required: true
        type: string
      sha256:
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: retained-artifact-${{ inputs.artifact_id }}
  cancel-in-progress: false
jobs:
  transport:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      PARENT_JOB_ID: ${{ inputs.parent_job_id }}
      MATRIX_INDEX: ${{ inputs.index }}
      ARTIFACT_ID: ${{ inputs.artifact_id }}
      ARTIFACT_SHA256: ${{ inputs.sha256 }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked --extra cloud
      - name: Reclaim disposable SDKs for retained ZIP and ODB
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          for directory in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/share/powershell /usr/local/share/chromium /opt/az /usr/lib/jvm /opt/hostedtoolcache/CodeQL; do
            if test -d "$directory" && ! test -L "$directory"; then
              sudo rm -rf --one-file-system -- "$directory"
            fi
          done
          sudo apt-get clean
          docker image prune --all --force
          df -B1 /
      - name: Verify complete original artifact and publish closed solver files
        run: >-
          uv run --locked --extra cloud python scripts/recover_matrix_artifact.py
          --source-run-id "$SOURCE_RUN_ID" --parent-job-id "$PARENT_JOB_ID"
          --index "$MATRIX_INDEX" --artifact-id "$ARTIFACT_ID" --sha256 "$ARTIFACT_SHA256"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: retained-matrix-transport-${{ github.run_id }}
          path: output/retained-matrix-receipt.json
          if-no-files-found: ignore
          retention-days: 30
