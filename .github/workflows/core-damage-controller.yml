name: Core damage · durable campaign controller
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-damage-controller
  cancel-in-progress: false
jobs:
  tick:
    if: github.repository == 'xuankhanh24/honeycomb-abaqus-studio' && vars.CORE_DAMAGE_CONTROLLER_ENABLED == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ vars.CORE_DAMAGE_CONTROLLER_SOURCE_SHA || vars.CORE_DAMAGE_SOURCE_SHA }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
      - id: dependencies
        run: uv sync --locked --extra cloud --extra campaign
      - name: Reconcile independent jobs and fill available owner slots
        env:
          CAMPAIGN_APP_ID: ${{ vars.CAMPAIGN_APP_ID }}
          CAMPAIGN_APP_PRIVATE_KEY: ${{ secrets.CAMPAIGN_APP_PRIVATE_KEY }}
          CORE_DAMAGE_CAMPAIGN_ID: ${{ vars.CORE_DAMAGE_CAMPAIGN_ID || 'core-damage-v2-20261106' }}
        run: uv run --locked --extra cloud --extra campaign python scripts/campaign_controller.py tick --campaign-id "$CORE_DAMAGE_CAMPAIGN_ID"
      - name: Keep the active campaign moving between scheduled events
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        env:
          CAMPAIGN_APP_ID: ${{ vars.CAMPAIGN_APP_ID }}
          CAMPAIGN_APP_PRIVATE_KEY: ${{ secrets.CAMPAIGN_APP_PRIVATE_KEY }}
          CORE_DAMAGE_CAMPAIGN_ID: ${{ vars.CORE_DAMAGE_CAMPAIGN_ID || 'core-damage-v2-20261106' }}
        run: |
          sleep 5
          uv run --locked --extra cloud --extra campaign python scripts/campaign_controller.py relay --campaign-id "$CORE_DAMAGE_CAMPAIGN_ID"
