name: Windows acceptance
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
    paths-ignore: ['docs/**', 'README.md']
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.402
      - run: uv sync --locked
      - run: uv run --locked ruff check src tests scripts
      - run: uv run --locked ty check src/honeycomb_studio --exclude src/honeycomb_studio/adapters
      - run: uv run --locked pytest -q
      - run: dotnet test tests/Desktop.Tests/Desktop.Tests.csproj -c Release
      - run: dotnet build desktop/HoneycombStudio/HoneycombStudio.csproj -c Release -p:Platform=x64 -p:RestoreLockedMode=true
      - run: uv run --locked honeycomb-studio schema > artifacts-schema.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: input-schema
          path: artifacts-schema.json
