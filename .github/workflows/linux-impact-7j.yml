name: Native Linux 7 J sphere impact acceptance
on:
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: honeycomb-licensed-solver
  cancel-in-progress: false
env:
  HONEYCOMB_ACTIONS_LOG: '1'
jobs:
  install:
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Prepare Python environment
        run: python3 scripts/actions_step.py --title "Cai moi truong Python" --details output/actions-logs/python.log -- uv sync --locked --extra cloud
      - name: Reserve exact source tag before long execution
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --locked --extra cloud python scripts/linux_media/impact_test.py --reserve
      - name: Prepare archive readers and isolated compatible Linux image
        run: |
          python3 scripts/actions_step.py --title "Cai cong cu doc media" --details output/actions-logs/packages.log -- bash -c 'sudo apt-get update -qq && sudo apt-get install -y unrar p7zip-full'
          python3 scripts/actions_step.py --title "Dung moi truong Linux" --details output/actions-logs/image.log -- docker build --build-arg MODEL_UID=$(id -u) -t honeycomb-install-probe scripts/linux_media
      - name: '02 - Download media: bytes, speed, ETA'
        run: python3 scripts/actions_step.py --title "Download va kiem ke media" --details output/actions-logs/download.log -- python3 scripts/inspect_linux_media.py
      - name: '03 - Verify ISO and install isolated Abaqus'
        run: python3 scripts/actions_step.py --title "Xac minh ISO va cai Abaqus" --details output/actions-logs/install.log -- bash scripts/linux_media/install_runtime.sh
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:honeycomb-runner
      - name: Run unchanged 6 ms 7 J sphere impact with perimeter-clamped re-entrant core
        env:
          ABAQUS_LICENSE_ENDPOINT: ${{ secrets.ABAQUS_LICENSE_ENDPOINT }}
          ABAQUS_VENDOR_PORT: ${{ secrets.ABAQUS_VENDOR_PORT }}
        run: uv run --locked --extra cloud python scripts/linux_media/impact_test.py
      - name: Preserve actual result files in checksum-verified release parts
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --locked --extra cloud python scripts/linux_media/impact_test.py --publish
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: linux-impact-7j-${{ github.run_id }}
          path: |
            output/actions-logs/**
            output/media-inspection/inspection.json
            output/install-probe/*.json
            output/install-probe/*.log
            output/impact-*.json
            ${{ runner.temp }}/honeycomb-impact/**/*.json
            ${{ runner.temp }}/honeycomb-impact/**/*.log
            ${{ runner.temp }}/honeycomb-impact/**/*.sta
            ${{ runner.temp }}/honeycomb-impact/**/*.inp
            ${{ runner.temp }}/honeycomb-impact/**/*.cae
            ${{ runner.temp }}/honeycomb-impact/**/*.odb
            ${{ runner.temp }}/honeycomb-impact/**/*.csv
            ${{ runner.temp }}/honeycomb-impact/**/*.parquet
            ${{ runner.temp }}/honeycomb-impact/**/*.pdf
            ${{ runner.temp }}/honeycomb-impact/**/*.docx
            ${{ runner.temp }}/honeycomb-impact/**/*.png
            ${{ runner.temp }}/honeycomb-impact/**/*.gif
            ${{ runner.temp }}/honeycomb-impact/**/*.dat
            ${{ runner.temp }}/honeycomb-impact/**/*.msg
            ${{ runner.temp }}/honeycomb-impact/**/*.txt
            ${{ runner.temp }}/honeycomb-impact/**/*.md
            ${{ runner.temp }}/honeycomb-impact/**/*.tar
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
