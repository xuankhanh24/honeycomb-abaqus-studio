name: Lưu bộ cài Linux vào Google Drive riêng
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: honeycomb-private-installer-mirror
  cancel-in-progress: false
jobs:
  mirror:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      HONEYCOMB_ACTIONS_LOG: '1'
      HONEYCOMB_LOG_TITLE: Kho bộ cài Abaqus Linux riêng · tải một lần, dùng lại
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked --extra cloud
      - name: Kiểm tra kết nối, bản đã lưu và dung lượng Drive
        id: preflight
        env:
          HONEYCOMB_DRIVE_CREDENTIALS_JSON: ${{ secrets.HONEYCOMB_DRIVE_CREDENTIALS_JSON }}
        run: uv run --locked python scripts/mirror_linux_media.py --preflight
      - name: Chuẩn bị công cụ giải nén
        if: steps.preflight.outputs.present != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y unrar p7zip-full
      - name: Tải và tách riêng ISO từ nguồn hiện tại
        if: steps.preflight.outputs.present != 'true'
        run: uv run --locked python scripts/inspect_linux_media.py
      - name: Lưu ISO, checksum và hướng dẫn vào Drive riêng
        if: steps.preflight.outputs.present != 'true'
        env:
          HONEYCOMB_DRIVE_CREDENTIALS_JSON: ${{ secrets.HONEYCOMB_DRIVE_CREDENTIALS_JSON }}
        run: uv run --locked python scripts/mirror_linux_media.py
      - name: Giữ biên bản xác minh, không lưu token hoặc phiên upload
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: private-installer-mirror-${{ github.run_id }}
          path: |
            output/media-mirror-receipt.json
            output/media-inspection/inspection.json
            output/actions-logs/**
          retention-days: 30
