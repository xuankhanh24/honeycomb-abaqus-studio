name: Mô phỏng bài đã chọn từ web
run-name: ${{ inputs.recover && 'Chạy bù' || 'Mô phỏng' }} · ${{ inputs.job_name || inputs.job_id }}
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Mã bài đã lưu bởi chủ dự án'
        required: true
        type: string
      job_name:
        description: 'Tóm tắt tham số áp dụng, ví dụ δ=25–45° · E=7 J · t=12 ms · 21 lượt'
        required: false
        type: string
      recover:
        description: 'Chỉ chạy bù lượt lỗi, giữ nguyên các lượt đã hoàn tất và thư mục dữ liệu'
        required: false
        type: boolean
        default: false
permissions:
  contents: write
  checks: write
  id-token: write
concurrency:
  group: honeycomb-batch-${{ inputs.job_id }}
  cancel-in-progress: false
  queue: max
env:
  HONEYCOMB_ACTIONS_LOG: '1'
  HONEYCOMB_LOG_TITLE: 'Mô phỏng nghiên cứu — tiến độ và kết quả'
jobs:
  prepare:
    name: Chuẩn bị · ${{ inputs.job_name || inputs.job_id }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      max_parallel: ${{ steps.matrix.outputs.max_parallel }}
      parameter_title: ${{ steps.matrix.outputs.parameter_title }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked --extra cloud
      - name: Kiểm tra đăng nhập Drive và bộ cài trước khi khởi động các runner
        env:
          ABAQUS_MEDIA_DRIVE_FILE_ID: ${{ vars.ABAQUS_MEDIA_DRIVE_FILE_ID }}
          HONEYCOMB_DRIVE_CREDENTIALS_JSON: ${{ secrets.HONEYCOMB_DRIVE_CREDENTIALS_JSON }}
        run: uv run --locked --extra cloud python scripts/prepare_linux_media.py --preflight
      - name: Kiểm tra môi trường dùng chung với lượt thử Linux
        env:
          MEDIA_ID: ${{ vars.ABAQUS_MEDIA_DRIVE_FILE_ID }}
          DRIVE: ${{ secrets.HONEYCOMB_DRIVE_CREDENTIALS_JSON }}
          LICENSE: ${{ secrets.ABAQUS_LICENSE_ENDPOINT }}
          VENDOR: ${{ secrets.ABAQUS_VENDOR_PORT }}
          TAILSCALE_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TAILSCALE_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
        run: |
          uv run --locked --extra cloud python -c 'import os; missing=[k for k in ("MEDIA_ID", "DRIVE", "LICENSE", "VENDOR", "TAILSCALE_ID", "TAILSCALE_AUDIENCE") if not os.getenv(k)]; assert not missing, "Thiếu cấu hình: " + ", ".join(missing)'
          uv run --locked --extra cloud python -c 'from pathlib import Path; from scripts.cloud_worker import require_qualification; require_qualification(Path.cwd())'
      - name: Nhận bài và bố trí một mô hình cho mỗi máy chạy
        id: matrix
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUD_JOB_ID: ${{ inputs.job_id }}
          RECOVER: ${{ inputs.recover }}
        run: |
          args=()
          if [ "$RECOVER" = "true" ]; then args+=(--recover); fi
          uv run --locked --extra cloud python scripts/cloud_matrix.py prepare --job-id "$CLOUD_JOB_ID" "${args[@]}"
  simulate:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.prepare.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: ${{ matrix.display_name }}
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    env:
      HONEYCOMB_LOG_TITLE: ${{ matrix.display_name }}
      CLOUD_JOB_ID: ${{ inputs.job_id }}
      ABAQUS_MEDIA_DRIVE_FILE_ID: ${{ vars.ABAQUS_MEDIA_DRIVE_FILE_ID }}
      ABAQUS_LICENSE_ENDPOINT: ${{ secrets.ABAQUS_LICENSE_ENDPOINT }}
      ABAQUS_VENDOR_PORT: ${{ secrets.ABAQUS_VENDOR_PORT }}
    steps:
      - name: Bắt đầu tính ngân sách thời gian toàn bộ công việc
        run: echo "HONEYCOMB_WORKFLOW_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra cloud
      - name: Kiểm tra môi trường Linux dùng chung trước khi cài đặt
        run: |
          uv run --locked --extra cloud python -c 'from pathlib import Path; from scripts.cloud_worker import require_qualification; require_qualification(Path.cwd())'
      - name: Kết nối riêng tới máy chủ cấp phép Abaqus
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:honeycomb-runner
      - name: Kiểm tra kết nối máy chủ cấp phép trước khi cài đặt
        run: uv run --locked --extra cloud python scripts/check_license_network.py
      - name: Cài công cụ và dựng môi trường tương thích Abaqus
        run: |
          python3 scripts/actions_step.py --title "Cài công cụ giải nén" --details output/actions-logs/packages.log -- bash -c 'sudo apt-get update -qq && sudo apt-get install -y unrar p7zip-full'
          python3 scripts/actions_step.py --title "Dựng môi trường Linux" --details output/actions-logs/image.log -- docker build --build-arg MODEL_UID=$(id -u) -t honeycomb-install-probe scripts/linux_media
      - name: Tải bộ cài từ Drive riêng · dung lượng, tốc độ, tiến độ
        env:
          HONEYCOMB_DRIVE_CREDENTIALS_JSON: ${{ secrets.HONEYCOMB_DRIVE_CREDENTIALS_JSON }}
        run: uv run --locked python scripts/actions_step.py --title "Tải ISO từ kho Drive" --details output/actions-logs/download.log -- uv run --locked python scripts/prepare_linux_media.py
      - name: Kiểm tra SHA-256 và cài Abaqus trong môi trường cách ly
        run: python3 scripts/actions_step.py --title "Kiểm tra và cài Abaqus" --details output/actions-logs/install.log -- bash scripts/linux_media/install_runtime.sh
      - name: Giải mô hình · ${{ matrix.display_name }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HONEYCOMB_DRIVE_CREDENTIALS_JSON: ${{ secrets.HONEYCOMB_DRIVE_CREDENTIALS_JSON }}
          CLOUD_CHILD_ID: ${{ matrix.child_id }}
        run: uv run --locked --extra cloud python scripts/native_cloud_worker.py --parent-id "$CLOUD_JOB_ID" --job-id "$CLOUD_CHILD_ID" --root "$RUNNER_TEMP/honeycomb-results"
      - name: Giữ log chẩn đoán khi bị gián đoạn
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: interrupted-diagnostics-${{ github.run_id }}-${{ matrix.index }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            output/actions-logs/**
            output/*.json
            output/install-probe/*.json
            output/install-probe/*.log
            ${{ runner.temp }}/honeycomb-results/**/requested-input.json
            ${{ runner.temp }}/honeycomb-results/**/resolved-input.json
            ${{ runner.temp }}/honeycomb-results/**/logs/*.log
      - name: Giữ toàn bộ kết quả khi xuất Releases lỗi để khôi phục không tính lại
        if: failure()
        timeout-minutes: 15
        uses: actions/upload-artifact@v7.0.2
        with:
          name: recoverable-results-${{ github.run_id }}-${{ matrix.index }}
          retention-days: 7
          compression-level: 0
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/honeycomb-results/**
            !${{ runner.temp }}/honeycomb-results/**/credentials/**
            !${{ runner.temp }}/honeycomb-results/**/session.json
            !${{ runner.temp }}/honeycomb-results/**/engine-settings.json
  finalize:
    name: Tổng hợp dữ liệu · ${{ needs.prepare.outputs.parameter_title || inputs.job_name || inputs.job_id }}
    needs: [prepare, simulate]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    # Only publishers serialize. Solver jobs from other batches keep running.
    concurrency:
      group: honeycomb-training-collection
      cancel-in-progress: false
      queue: max
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked --extra cloud
      - name: Tổng hợp các lượt hoàn tất và các lượt bị gián đoạn
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUD_JOB_ID: ${{ inputs.job_id }}
        run: uv run --locked --extra cloud python scripts/cloud_matrix.py finalize --job-id "$CLOUD_JOB_ID"
      - name: Gộp dữ liệu tất cả job · đầu vào, đầu ra và bảng huấn luyện chung
        if: needs.prepare.result == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUD_JOB_ID: ${{ inputs.job_id }}
        run: uv run --locked --extra cloud python scripts/collect_cloud_training.py --full-job-id "$CLOUD_JOB_ID" --require-training-job "$CLOUD_JOB_ID"
